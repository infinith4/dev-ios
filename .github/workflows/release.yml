name: iOS Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    name: Build and Release iOS App
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Show Xcode version
      run: xcodebuild -version

    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Build and Archive
      run: |
        xcodebuild \
          -project MyiOSApp/MyiOSApp.xcodeproj \
          -scheme MyiOSApp \
          -sdk iphoneos \
          -configuration Release \
          -archivePath $PWD/build/MyiOSApp.xcarchive \
          archive \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

    - name: Export IPA
      run: |
        mkdir -p build/Payload
        cp -R build/MyiOSApp.xcarchive/Products/Applications/MyiOSApp.app build/Payload/
        cd build
        zip -r MyiOSApp.ipa Payload
        cd ..

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ steps.get_version.outputs.VERSION }}
        draft: false
        prerelease: false
        body: |
          ## MyiOSApp Release ${{ steps.get_version.outputs.VERSION }}

          ### Changes
          - See commit history for details

          ### Installation
          1. Download the IPA file
          2. Install using your preferred method (Xcode, iOS App Signer, etc.)

          **Note**: This is an unsigned build. For App Store distribution, proper code signing is required.

    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./build/MyiOSApp.ipa
        asset_name: MyiOSApp-${{ steps.get_version.outputs.VERSION }}.ipa
        asset_content_type: application/octet-stream
